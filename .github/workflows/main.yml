name: 🔁 Auto Update RoarZone playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"   # প্রতি ১ ঘন্টা পর চলবে

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📥 Install Python libraries
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp beautifulsoup4

      - name: 🔓 Unlock ZIP
        run: |
          python unlock.py
        env:
          ZIP_PASSWORD: ${{ secrets.ZIP_PASSWORD }}

      - name: ▶️ Run playlist generator
        run: |
          python generate_playlist.py

      - name: 💾 Commit & Push generated files
        run: |
          git config user.name "Auto Bot"
          git config user.email "bot@example.com"

          git add RoarZone.m3u RoarZone.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🔄 Auto update RoarZone playlist"
            git push
          fi
