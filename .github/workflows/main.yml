name: 📺 Manual Update RoarZone Playlist

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📥 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp beautifulsoup4

      - name: 🔓 Unlock ZIP files
        run: |
          python unlock.py
        env:
          ZIP_PASSWORD: ${{ secrets.ZIP_PASSWORD }}

      - name: ▶️ Run playlist generator
        run: |
          python main/generate_playlist.py

      - name: 💾 Commit and Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add RoarZone.m3u RoarZone.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "🔄 Manual update RoarZone playlist"
            git push
          fi
