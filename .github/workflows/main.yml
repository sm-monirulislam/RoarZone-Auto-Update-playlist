name: 📺 Manual Update RoarZone Playlist

on:
  workflow_dispatch:   # 👉 শুধু হাতে Run হবে

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # --------------------------
      # 1. Checkout repository
      # --------------------------
      - name: 📦 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------
      # 2. Setup Python
      # --------------------------
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # --------------------------
      # 3. Install dependencies
      # --------------------------
      - name: 📥 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp beautifulsoup4

      # --------------------------
      # 4. Unlock ZIP (Password Protected)
      # --------------------------
      - name: 🔓 Unlock ZIP files
        run: |
          python unlock.py
        env:
          ZIP_PASSWORD: ${{ secrets.ZIP_PASSWORD }}

      # --------------------------
      # 5. Run Playlist Generator
      # --------------------------
      - name: ▶️ Run playlist generator
        run: |
          python generate_playlist.py

      # --------------------------
      # 6. Commit & Push
      # --------------------------
      - name: 💾 Commit and Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add RoarZone.m3u RoarZone.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "🔄 Manual update RoarZone playlist"
            git push
          fi
